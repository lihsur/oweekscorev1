<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel - Scoreboard Administration</title>
  <style>
    :root {
      --primary: #4361ee;
      --secondary: #3f37c9;
      --background: #f8f9fa;
      --text: #212529;
      --dark-gray: #6c757d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
    body { background: var(--background); color: var(--text); padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 40px; padding: 20px; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; border-radius: 10px; }
    h1, h2 { margin-bottom: 20px; }
    .scoreboard-section { margin-bottom: 40px; background: white; padding: 25px; border-radius: 10px; }
    .form-group { margin-bottom: 15px; }
    label { font-weight: bold; margin-bottom: 5px; }
    select, input { width: 100%; padding: 10px; margin-bottom: 10px; }
    button { background: var(--primary); color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
    footer { text-align: center; margin-top: 40px; padding: 20px; background: var(--dark-gray); color: white; border-radius: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Admin Panel</h1>
      <p>Score Update & Event Administration</p>
    </header>

    <!-- Login Section -->
    <div id="login-section">
      <h2>Admin Login</h2>
      <p>Please enter the admin password:</p>
      <input type="password" id="admin-password" placeholder="Enter admin password" />
      <button id="admin-login-btn">Login</button>
    </div>

    <!-- Admin Controls -->
    <div id="admin-controls" style="display:none;">
      <div class="scoreboard-section">
        <h2>Add Completed Event</h2>
        <div class="form-group">
          <label for="event-select">Select Event:</label>
          <select id="event-select">
            <!-- Options populated from data.php -->
          </select>
        </div>
        <div class="form-group">
          <label for="firstTeam">1st Place (Team):</label>
          <select id="firstTeam">
            <option value="Alligators">Alligators</option>
            <option value="Bobcats">Bobcats</option>
            <option value="Cheetahs">Cheetahs</option>
            <option value="Dragons">Dragons</option>
            <option value="Eagles">Eagles</option>
            <option value="Foxes">Foxes</option>
          </select>
        </div>
        <div class="form-group">
          <label for="secondTeam">2nd Place (Team):</label>
          <select id="secondTeam">
            <option value="Alligators">Alligators</option>
            <option value="Bobcats">Bobcats</option>
            <option value="Cheetahs">Cheetahs</option>
            <option value="Dragons">Dragons</option>
            <option value="Eagles">Eagles</option>
            <option value="Foxes">Foxes</option>
          </select>
        </div>
        <div class="form-group">
          <label for="thirdTeam">3rd Place (Team):</label>
          <select id="thirdTeam">
            <option value="Alligators">Alligators</option>
            <option value="Bobcats">Bobcats</option>
            <option value="Cheetahs">Cheetahs</option>
            <option value="Dragons">Dragons</option>
            <option value="Eagles">Eagles</option>
            <option value="Foxes">Foxes</option>
          </select>
        </div>
        <button id="submit-event">Submit Completed Event</button>
      </div>
    </div>

    <button onclick="window.location.href='index.html'">Back to Main Page</button>
  </div>

  <footer>
    <p>Championship Scoreboard System Admin Panel &copy; 2025</p>
  </footer>

  <script>
    const teamNames = ['Alligators', 'Bobcats', 'Cheetahs', 'Dragons', 'Eagles', 'Foxes'];
    const dataURL = 'data.php';

    // Simple admin login
    document.getElementById('admin-login-btn').addEventListener('click', () => {
      const pwd = document.getElementById('admin-password').value;
      if (pwd === 'admin123') {
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('admin-controls').style.display = 'block';
        populateEventDropdown();
      } else {
        alert('Incorrect password. Please try again.');
      }
    });

    // Populate the event dropdown by reading the upcoming events from the server
    async function populateEventDropdown() {
      try {
        const response = await fetch(dataURL);
        const data = await response.json();
        console.log("Fetched data for dropdown:", data);  // Debug log
        const eventSelect = document.getElementById('event-select');
        eventSelect.innerHTML = '';
        if (data.upcomingEvents && data.upcomingEvents.length > 0) {
          data.upcomingEvents.forEach(ev => {
            const option = document.createElement('option');
            option.value = ev.name;
            option.textContent = ev.name;
            eventSelect.appendChild(option);
          });
        } else {
          eventSelect.innerHTML = '<option>No upcoming events</option>';
          document.getElementById('submit-event').disabled = true;
        }
      } catch (error) {
        console.error("Error fetching events:", error);
      }
    }

    // When the admin submits the completed event, update global data via POST to data.php
    document.getElementById('submit-event').addEventListener('click', async () => {
      const selectedEvent = document.getElementById('event-select').value;
      const firstTeam = document.getElementById('firstTeam').value;
      const secondTeam = document.getElementById('secondTeam').value;
      const thirdTeam = document.getElementById('thirdTeam').value;

      if (firstTeam === secondTeam || firstTeam === thirdTeam || secondTeam === thirdTeam) {
        alert("Please choose three different teams for 1st, 2nd, and 3rd places.");
        return;
      }

      try {
        const response = await fetch(dataURL);
        const data = await response.json();
        console.log("Current data in admin submission:", data);  // Debug log

        const events = data.upcomingEvents || [];
        const eventIndex = events.findIndex(ev => ev.name === selectedEvent);
        if (eventIndex === -1) {
          alert("Event not found.");
          return;
        }
        const eventObj = events[eventIndex];

        // Update scores for each team
        const firstIndex = teamNames.indexOf(firstTeam);
        const secondIndex = teamNames.indexOf(secondTeam);
        const thirdIndex = teamNames.indexOf(thirdTeam);
        data.scores[firstIndex] += eventObj.first;
        data.scores[secondIndex] += eventObj.second;
        data.scores[thirdIndex] += eventObj.third;

        // Record the completed event
        data.completedEvents = data.completedEvents || [];
        data.completedEvents.push({
          event: selectedEvent,
          first: firstTeam,
          second: secondTeam,
          third: thirdTeam
        });

        // Remove the event from upcomingEvents
        events.splice(eventIndex, 1);
        data.upcomingEvents = events;

        // Push updated data back to the server
        await fetch(dataURL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        alert(`Event "${selectedEvent}" has been recorded and scores updated.`);
        window.location.href = 'index.html';
      } catch (error) {
        console.error("Error updating event:", error);
      }
    });
  </script>
</body>
</html>

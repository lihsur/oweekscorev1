<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>O‑week Section Wars Co26 Scoreboard</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
  <style>
    :root {
      --primary: #4361ee;
      --secondary: #3f37c9;
      --background: #f8f9fa;
      --text: #212529;
      --light-gray: #e9ecef;
      --dark-gray: #6c757d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
    body { background: var(--background); color: var(--text); padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 40px; padding: 20px; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; border-radius: 10px; }
    h1 { font-size: 2.5rem; }
    h2 { font-size: 1.8rem; margin-bottom: 20px; color: var(--primary); border-bottom: 2px solid var(--primary); padding-bottom: 10px; }
    .scoreboard-section { margin-bottom: 40px; background: white; padding: 25px; border-radius: 10px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { padding: 12px; border-bottom: 1px solid var(--light-gray); }
    th { background: var(--primary); color: white; text-transform: uppercase; }
    tr:nth-child(even) { background: var(--light-gray); }
    .admin-button { margin-top: 20px; padding: 10px 20px; background: var(--primary); color: white; border: none; border-radius: 5px; cursor: pointer; }
    footer { text-align: center; margin-top: 40px; padding: 20px; background: var(--dark-gray); color: white; border-radius: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>O‑week Section Wars Co26 Scoreboard</h1>
    </header>
    
    <!-- Current Team Ranks Table -->
    <div class="scoreboard-section">
      <h2>Current Team Ranks</h2>
      <table id="rank-table">
        <thead>
          <tr>
            <th>Rank</th>
            <th>Team</th>
            <th>Points</th>
          </tr>
        </thead>
        <tbody><!-- Filled dynamically --></tbody>
      </table>
    </div>
    
    <!-- Overall Team Standings (Chart) -->
    <div class="scoreboard-section">
      <h2>Overall Team Standings</h2>
      <canvas id="overallScores" style="width: 100%; height: 350px;"></canvas>
    </div>
    
    <!-- Completed Events (Initially empty) -->
    <div class="scoreboard-section">
      <h2>Completed Events Results</h2>
      <table id="results-table">
        <thead>
          <tr>
            <th>Event</th>
            <th>1st Place</th>
            <th>2nd Place</th>
            <th>3rd Place</th>
          </tr>
        </thead>
        <tbody><!-- Filled dynamically --></tbody>
      </table>
    </div>
    
    <!-- Points chart (Upcoming events) -->
    <div class="scoreboard-section">
      <h2>Points chart</h2>
      <table id="schedule-table">
        <thead>
          <tr>
            <th>Event Name</th>
            <th>1st Place Points</th>
            <th>2nd Place Points</th>
            <th>3rd Place Points</th>
          </tr>
        </thead>
        <tbody><!-- Filled dynamically --></tbody>
      </table>
    </div>
  </div>

  <footer>
    <p>Championship Scoreboard System &copy; 2025</p>
    <button class="admin-button" onclick="window.location.href='admin.html'">Admin Login</button>
  </footer>

  <script>
    // Updated team names
    const teamNames = ['Alligators', 'Bobcats', 'Cheetahs', 'Dragons', 'Eagles', 'Foxes'];
    let scores = [];
    let upcomingEvents = [];
    let completedEvents = [];

    // Setup Chart.js for overall standings
    const ctx = document.getElementById('overallScores').getContext('2d');
    let scoresChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: teamNames,
        datasets: [{
          label: 'Total Points',
          data: [], // To be filled after fetching data
          backgroundColor: [
            'rgba(255, 99, 132, 0.8)',
            'rgba(54, 162, 235, 0.8)',
            'rgba(255, 206, 86, 0.8)',
            'rgba(75, 192, 192, 0.8)',
            'rgba(153, 102, 255, 0.8)',
            'rgba(255, 159, 64, 0.8)'
          ]
        }]
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        scales: {
          x: { beginAtZero: true, title: { display: true, text: 'Total Points' } },
          y: { title: { display: true, text: 'Teams' } }
        }
      }
    });

    // Fetch data from data.php
    async function fetchData() {
      try {
        const response = await fetch('data.php');
        const data = await response.json();
        console.log("Fetched data:", data);  // Debug log
        return data;
      } catch (error) {
        console.error("Error fetching data:", error);
        return {};
      }
    }

    // Update the UI based on fetched data
    async function updateUI() {
      const data = await fetchData();
      scores = data.scores || [];
      upcomingEvents = data.upcomingEvents || [];
      completedEvents = data.completedEvents || [];

      // Update the overall chart
      scoresChart.data.datasets[0].data = scores;
      scoresChart.update();

      updateRankTable();
      updateCompletedEventsTable();
      updateScheduleTable();
    }

    function updateRankTable() {
      const teams = teamNames.map((name, i) => ({ name, score: scores[i] }));
      teams.sort((a, b) => b.score - a.score);
      const tbody = document.querySelector('#rank-table tbody');
      tbody.innerHTML = '';
      teams.forEach((team, index) => {
        const row = document.createElement('tr');
        row.innerHTML = `<td>${index + 1}</td><td>${team.name}</td><td>${team.score}</td>`;
        tbody.appendChild(row);
      });
    }

    function updateCompletedEventsTable() {
      const tbody = document.querySelector('#results-table tbody');
      tbody.innerHTML = '';
      if (completedEvents.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4">No completed events yet.</td></tr>';
      } else {
        completedEvents.forEach(ev => {
          const row = document.createElement('tr');
          row.innerHTML = `<td>${ev.event}</td>
                           <td>${ev.first}</td>
                           <td>${ev.second}</td>
                           <td>${ev.third}</td>`;
          tbody.appendChild(row);
        });
      }
    }

    function updateScheduleTable() {
      const tbody = document.querySelector('#schedule-table tbody');
      tbody.innerHTML = '';
      if (upcomingEvents.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4">No upcoming events.</td></tr>';
      } else {
        upcomingEvents.forEach(ev => {
          const row = document.createElement('tr');
          row.innerHTML = `<td>${ev.name}</td>
                           <td>${ev.first}</td>
                           <td>${ev.second}</td>
                           <td>${ev.third}</td>`;
          tbody.appendChild(row);
        });
      }
    }

    // Initial load and periodic refresh every 10 seconds
    updateUI();
    setInterval(updateUI, 10000);
  </script>
</body>
</html>
